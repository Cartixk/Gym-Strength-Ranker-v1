<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Strength Ranker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="hero">
        <h1>Gym Strength Ranker</h1>
        <p class="hero-subtitle">Find out where you rank against real strength standards</p>
    </header>
    <div class="wrapper">
        <div class="container">

            <!-- error msg -->
            <p class="error-message" data-error></p>
            <!-- bw and gender -->
            <form data-rankform>
                <label for="bw">Bodyweight</label>
                <input class="bw" id="bw" type="number" step="0.1" placeholder="Enter Your Bodyweight(kgs)">
                <label for="gender">Select Your Gender</label>
                <select class="gender" id="gender">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <!-- all about exercises -->

                <label for="exercises">Select exercise</label>
                <select class="exercises" id="exercises">
                    <option value="" disabled selected>Select Exercise</option>
                    <option value="squat">Squat</option>
                    <option value="bench">Bench press</option>
                    <option value="deadlift">Deadlift</option>
                    <option value="ohp">Overhead press</option>
                    <option value="bor">Bent over row</option>
                </select>
                <!-- weights and reps -->
                <label for="lift">Weight</label>
                <input class="lift" id="lift" type="number" step="0.1" placeholder="Enter Weight lifted(kgs)">
                <label for="reps">Reps</label>
                <input class="reps" id="reps" type="number" placeholder="Enter no. of reps">

                <!-- calculate -->
                <button type="submit" class="btn">
                    Calculate Your Rank
                </button>

            </form>

            <!-- result and rank block -->

            <div class="result-overlay" data-result>
                <div class="result">
                    <button type="button" class="close-result">&times;</button>

                    <p class="result-label">YOUR STRENGTH RANK</p>
                    <img data-ranking alt="Your strength rank">
                    <p data-rankname></p>
                    <p data-onerm></p>
                    <p data-ratio></p>
                </div>
            </div>

        </div>
    </div>


    <script src="index.js"></script>
</body>

</html>
